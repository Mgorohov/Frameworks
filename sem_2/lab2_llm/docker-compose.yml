version: '3.8'
services:
  ollama:
    build: ./ollama
    container_name: ollama
    ports:
      - "11435:11434"
    volumes:
      - ollama_data:/root/.ollama

  mcp:
    build: ./mcp_service
    container_name: mcp_service_1
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    environment:
      - OLLAMA_HOST=ollama:11434

volumes:
  ollama_data: